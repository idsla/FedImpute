name: Real-world Data Test Basic Usage

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  real-world-data-basic-usage:
    name: basic usage / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12.3"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys

          torch_version = "2.6.0+cpu" if sys.version_info < (3, 11) else "2.9.1+cpu"
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              f"torch=={torch_version}",
              "--index-url",
              "https://download.pytorch.org/whl/cpu",
          ])
          PY
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest

      - name: Run real-world basic usage test
        run: python -m pytest -q tests/real_data/test_basic_usage.py -m real_data
