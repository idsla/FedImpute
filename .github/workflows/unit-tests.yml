name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: ${{ matrix.suite.module }} / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12.3"
          - "3.14"
        suite:
          - module: data-prep
            tests: tests/unit/data_prep
          - module: scenario
            tests: tests/unit/scenario
          - module: execution-environment
            tests: tests/unit/execution_environment
          - module: evaluation
            tests: tests/unit/evaluation
          - module: pipeline
            tests: tests/unit/pipeline

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys

          torch_version = "2.6.0+cpu" if sys.version_info < (3, 11) else "2.9.1+cpu"
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              f"torch=={torch_version}",
              "--index-url",
              "https://download.pytorch.org/whl/cpu",
          ])
          PY
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest

      - name: Run module unit tests
        run: python -m pytest -q ${{ matrix.suite.tests }}
