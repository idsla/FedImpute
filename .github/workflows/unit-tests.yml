name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: data-prep
            tests: tests/unit/data_prep
          - module: scenario
            tests: tests/unit/scenario
          - module: execution-environment
            tests: tests/unit/execution_environment
          - module: evaluation
            tests: tests/unit/evaluation
          - module: pipeline
            tests: tests/unit/pipeline

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest

      - name: Run module unit tests
        run: python -m pytest -q ${{ matrix.tests }}
