name: Deploy Documentation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: deploy docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          with open("pyproject.toml", "rb") as fp:
              version = tomllib.load(fp)["tool"]["poetry"]["version"]

          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(f"Tag {tag} does not match package version {expected_tag}.")
          PY

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys

          torch_version = "2.6.0+cpu" if sys.version_info < (3, 11) else "2.9.1+cpu"
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              f"torch=={torch_version}",
              "--index-url",
              "https://download.pytorch.org/whl/cpu",
          ])
          PY
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install mkdocs mkdocs-autorefs mkapi python-markdown-math

      - name: Build documentation
        run: python -m mkdocs build

      - name: Deploy documentation to GitHub Pages
        run: python -m mkdocs gh-deploy --force
