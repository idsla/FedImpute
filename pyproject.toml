[tool.poetry]
name = "fedimpute"
version = "0.2.6"
description = "fedimpute is a benchmarking tool for federated imputation"
authors = ["Sitao Min (idlsa Rutgers University) <sitaomin1994@gmail.com>"]
license = "GPL GNU v3.0"
readme = "README.md"
package-mode = true
include = [
    { path = "fedimpute/data_prep/example_data/heart_disease/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.9,<3.15"
numpy = [
    { version = "1.26.4", python = "<3.11" },
    { version = "2.3.5", python = ">=3.11" },
]
pandas = [
    { version = "2.2.2", python = "<3.11" },
    { version = "2.3.3", python = ">=3.11" },
]
pot = [
    { version = "0.9.5", python = "<3.11" },
    { version = "0.9.6.post1", python = ">=3.11" },
]
scikit-learn = [
    { version = "1.6.1", python = "<3.11" },
    { version = "1.8.0", python = ">=3.11" },
]
scipy = [
    { version = "1.13.1", python = "<3.11" },
    { version = "1.17.1", python = ">=3.11" },
]
loguru = "0.7.3"
n-sphere = "1.2.0"
tqdm = "4.67.1"
gower = "0.1.2"
tabulate = "0.9.0"
matplotlib = [
    { version = "3.9.4", python = "<3.11" },
    { version = "3.10.8", python = ">=3.11" },
]
seaborn = "0.13.2"
tensorboard = [
    { version = "2.18.0", python = "<3.11" },
    { version = "2.20.0", python = ">=3.11" },
]
torch = [
    { version = "2.6.0", python = "<3.11" },
    { version = "2.9.1", python = ">=3.11" },
]
openpyxl = "3.1.5"
statsmodels = [
    { version = "0.14.4", python = "<3.11" },
    { version = "0.14.6", python = ">=3.11" },
]
xgboost = [
    { version = "2.1.4", python = "<3.11" },
    { version = "3.1.2", python = ">=3.11" },
]
requests = [
    { version = "2.32.3", python = "<3.11" },
    { version = "2.32.5", python = ">=3.11" },
]
umap-learn = "^0.5.7"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
pre-commit = "^3.7.1"
pytest = "^8.2.2"
black = "^24.4.2"
flake8-docstrings = "^1.7.0"
isort = "^5.13.2"
mypy = "^1.10.0"
pylint = "^3.2.3"
tox = "^4.15.1"
mkdocs = "^1.6.0"
jupyter = "^1.0.0"
mkdocs-swan = "^0.4.0"
mkdocs-cinder = "^1.2.0"
mkdocs-material = "^9.5.27"
mkdocstrings = {extras = ["python"], version = "^0.25.1"}
python-markdown-math = "^0.8"
mkautodoc = "^0.2.0"
mkapi = {version = "^2.1.0", python = ">=3.10"}
ipykernel = "^6.29.5"
mkdocs-jupyter = "^0.25.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast deterministic module tests",
    "smoke: small end-to-end integration tests",
    "real_data: tests requiring bundled or downloaded real datasets",
    "slow: tests that are too slow for default PR CI",
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
